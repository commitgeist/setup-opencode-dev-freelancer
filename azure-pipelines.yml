trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      sudo apt-get update -qq
      sudo apt-get install -y -qq shellcheck jq bats
    displayName: Instalar validadores

  - script: bash -n setup.sh
    displayName: Sintaxe Bash

  - script: shellcheck setup.sh
    displayName: ShellCheck

  - script: bats tests/
    displayName: Testes Bats
